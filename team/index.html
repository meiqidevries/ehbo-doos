<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>EHBO-doos</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<script>
/* De teampagina is opgegaan in de app. Oude links en QR-codes blijven werken. */
(function () {
  var h = (location.hash || '').replace('#', ''), d = h.split('-'), doel = 'team';
  if (['start', 'week', 'klant', 'terug'].indexOf(d[0]) >= 0) doel = 'sessie-' + d[0] + '-' + (parseInt(d[1], 10) || 1);
  else if (h === 'kaarten') doel = 'kaarten-zalf';
  else if (h === 'leiding') doel = 'leiding';
  location.replace('../#' + doel);
})();
</script>
</head>
<body><p style="font-family:system-ui,sans-serif;padding:1rem">De teampagina staat nu in de app: <a href="../#team">open de EHBO-doos</a>.</p></body>
</html>
